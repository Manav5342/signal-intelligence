name: AI debug (temporary)
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":20}'
          for V in "2026-03-10" "2022-11-28" "none"; do
            echo "=== api-version $V"
            if [ "$V" = "none" ]; then
              curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$BODY" | head -c 900; echo
            else
              curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: $V" -H "Content-Type: application/json" -d "$BODY" | head -c 900; echo
            fi
          done
          echo "=== catalog"
          curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" | head -c 700; echo
          echo "=== legacy azure endpoint"
          curl -sS -i -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":20}' | head -c 900; echo
          echo "=== python requests"
          python3 - <<'PY'
          import os, requests
          r = requests.post("https://models.github.ai/inference/chat/completions",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json"},
              json={"model": "openai/gpt-4.1-mini", "messages": [{"role": "user", "content": "Say hi"}], "max_tokens": 20}, timeout=60)
          print(r.status_code, r.headers.get("content-type"), repr(r.text[:300]))
          print("env proxies:", {k: v for k, v in os.environ.items() if "proxy" in k.lower()})
          PY
