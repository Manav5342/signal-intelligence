name: Validate sources

# Checks every configured feed from GitHub's runners and prints a health table.
# Run it after editing config.json. It doesn't change any data.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 08:30 IST

permissions:
  contents: read
  models: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check feeds
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m scripts.validate_sources --no-write | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check AI provider
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          set -o pipefail
          echo '### AI provider check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m scripts.check_ai | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
